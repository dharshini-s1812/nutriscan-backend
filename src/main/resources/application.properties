
spring.application.name=FoodAnalyzer

# Catalyst AppSail port; fallback to 8080 locally
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:8080}
server.address=0.0.0.0

# Supabase PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.ntjlclkqlfzjqcraiheq}
spring.datasource.password=${DB_PASSWORD}

# Database schema already migrated
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}
